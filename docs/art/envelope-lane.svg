<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of validating one provenance envelope: envelope, root shape, subject and source, references, calendar check, validation block, scrub, and exit code. An envelope is a single JSON object with five required fields. The root refuses unexpected fields by naming them rather than ignoring them, and the same rule applies to every nested object at every depth. Subject says which claim the envelope is about; source says what kind of thing it came from, drawn from five kinds: official documentation, a paper, a release note, a local fixture, or other. References must carry at least one entry, and each entry needs a name, a locator, and a retrieval date. The date is checked twice: once against the ten-character pattern and once against the calendar, so a well-shaped date that never existed is still an error. The validation block carries a status of verified, partial, or unknown. Every message is scrubbed before it is printed. A batch exits zero only when nothing in it was invalid. Three outcomes: valid, invalid, and no schema."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE ENVELOPE, ONE VERDICT</text><text class="h" x="44" y="72">What the validator reads before a provenance claim is publishable</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H367.75V213"/><text class="k" x="592.25" y="245" text-anchor="middle" fill="var(--drift)">EVERY NESTED OBJECT IS CHECKED ALIKE</text><path class="back" marker-end="url(#ab)" d="M816.75 398V420H367.75V405"/><text class="k" x="592.25" y="437" text-anchor="middle" fill="var(--drift)">A STATUS IS NOT A VERDICT ABOUT THE CLAIM</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Envelope</text><text class="s" x="58" y="168">One JSON object, five required</text><text class="s" x="58" y="183">fields.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Root shape</text><text class="s" x="282.5" y="168">An unexpected field is named,</text><text class="s" x="282.5" y="183">not ignored.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Subject and source</text><text class="s" x="507" y="168">Which claim, and which of five</text><text class="s" x="507" y="183">source kinds.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">References</text><text class="s" x="731.5" y="168">At least one. Name, locator,</text><text class="s" x="731.5" y="183">retrieval date.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Calendar check</text><text class="s" x="58" y="360">The pattern passes; the date</text><text class="s" x="58" y="375">may not exist.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Validation</text><text class="s" x="282.5" y="360">Verified, partial, or unknown.</text><text class="s" x="282.5" y="375">Nothing else.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Scrub</text><text class="s" x="507" y="360">Every message goes through the</text><text class="s" x="507" y="375">redactor.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Exit code</text><text class="s" x="731.5" y="360">One bad file, and the batch</text><text class="s" x="731.5" y="375">reports failure.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">VALID</text><text class="s" x="58" y="509" font-size="10.5">every field matched, nothing left over</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">INVALID</text><text class="s" x="357.33" y="509" font-size="10.5">one path and one message per error</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">NO SCHEMA</text><text class="s" x="656.67" y="509" font-size="10.5">the schema itself would not load</text><text class="s" x="44" y="546">The validator reports errors and publishes nothing. Every message it prints has been through the redactor first, so a malformed envelope cannot leak the value that made it malformed.</text></svg>
