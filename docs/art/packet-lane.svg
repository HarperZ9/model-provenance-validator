<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a batch run: batch, per file, tally, action items, status, packet, self-check, and handoff. One command takes many envelope files. A file that cannot be read, or that is not JSON, becomes a single error attached to the root rather than a crash, so it still counts toward the tally. The tally records four numbers: total, valid, invalid, and the total error count. Action items are one line per invalid file, capped at the first eight, so a large broken batch produces a readable list rather than a wall. Status is ready when nothing was invalid and blocked otherwise. The packet carries three claims and one check. Before printing, the packet is validated against the shared proof-surface contract, and a packet that fails that check is written to standard error rather than standard output. The result is readable by the proof index without this tool present. Three outcomes: ready, blocked, and not printed."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">MANY ENVELOPES, ONE PACKET</text><text class="h" x="44" y="72">How a batch of envelopes becomes a packet another tool can read</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H367.75V213"/><text class="k" x="592.25" y="245" text-anchor="middle" fill="var(--drift)">A FILE THAT WILL NOT READ STILL COUNTS</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">A PACKET THAT FAILS IS NEVER PRINTED</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Batch</text><text class="s" x="58" y="168">Many envelope files, one</text><text class="s" x="58" y="183">command.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Per file</text><text class="s" x="282.5" y="168">An unreadable file is an</text><text class="s" x="282.5" y="183">error, not a crash.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Tally</text><text class="s" x="507" y="168">Total, valid, invalid, error</text><text class="s" x="507" y="183">count.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Action items</text><text class="s" x="731.5" y="168">One line per bad file, first</text><text class="s" x="731.5" y="183">eight only.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Status</text><text class="s" x="58" y="360">Ready when nothing was</text><text class="s" x="58" y="375">invalid. Else blocked.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Packet</text><text class="s" x="282.5" y="360">Three claims and one check,</text><text class="s" x="282.5" y="375">always.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Self-check</text><text class="s" x="507" y="360">Validated against the shared</text><text class="s" x="507" y="375">contract.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Handoff</text><text class="s" x="731.5" y="360">The index reads it without</text><text class="s" x="731.5" y="375">this tool.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">READY</text><text class="s" x="58" y="509" font-size="10.5">no envelope in the batch was invalid</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">BLOCKED</text><text class="s" x="357.33" y="509" font-size="10.5">at least one envelope did not validate</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">NOT PRINTED</text><text class="s" x="656.67" y="509" font-size="10.5">the packet failed its own contract</text><text class="s" x="44" y="546">The packet is validated against the shared contract before it is printed, and a packet that fails is not printed at all. The contract lives in the proof-surface package, so this tool cannot quietly drift away from it.</text></svg>
